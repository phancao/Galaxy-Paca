version: "2"

# LƯU Ý VỀ LƯỢC ĐỒ: tệp này khai version "2", nên MỌI tuỳ chỉnh linter phải nằm
# dưới `linters.settings` / `linters.exclusions` và `formatters.settings`, KHÔNG
# phải `linters-settings`, `formatters-settings` và `issues.exclude-rules` ở cấp
# đỉnh (đó là lược đồ v1). Trước 22/09 tệp này trộn hai lược đồ: golangci-lint
# v2 lặng lẽ bỏ qua phần v1, nên mọi miễn trừ cho tệp _test.go và mọi cấu hình
# revive / exhaustive / goimports đều KHÔNG có tác dụng — thấy rõ ở chỗ errcheck
# vẫn đỏ trên internal/config/tenants_test.go dù đã có luật miễn trừ cho _test.go.

linters:
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # go vet checks
    - ineffassign    # assignments that are never used
    - staticcheck    # staticcheck suite (includes gosimple + unused)
    - misspell       # common spelling mistakes
    - revive         # drop-in replacement for golint
    - bodyclose      # http response body close
    - noctx          # http requests without context
    - exhaustive     # missing switch cases on enums
    - gocritic       # code style and performance suggestions

  settings:
    revive:
      rules:
        - name: exported
          severity: warning
        - name: var-naming
          severity: warning
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    rules:
      # Test files: relax some rules
      - path: "_test\\.go$"
        linters:
          - errcheck
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/Paca-AI/api

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
