name: ADR-039 Authorization Gate

# A ratchet, not an audit. It fails only when a state-changing route appears
# WITHOUT a permission check and outside tools/authzgate/baseline.txt, so the
# nine self-scoped routes already there stay accepted while a tenth cannot be
# added quietly.
#
# Runs on every PR that touches services/api, and on pushes to the default
# branch so the baseline cannot rot unnoticed.
on:
  pull_request:
    paths:
      - "services/api/**"
      - ".github/workflows/adr039-authz.yml"
  push:
    branches: [master]
    paths:
      - "services/api/**"
      - ".github/workflows/adr039-authz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adr039-authz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  authz-ratchet:
    name: State-changing routes must carry a permission check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: services/api/go.sum
      - name: authzgate
        working-directory: services/api
        run: go run ./tools/authzgate .
